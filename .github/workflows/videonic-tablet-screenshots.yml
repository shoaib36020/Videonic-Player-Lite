name: Videonic Tablet Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 7-inch
            profile: '7in WSVGA (Tablet)'
          - name: 10-inch
            profile: '10.1in WXGA (Tablet)'

    steps:
      - name: Checkout Videonic source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle (no wrapper needed)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'

      - name: Build Videonic debug APK (no signing key needed)
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --max-workers=2 \
            --no-parallel \
            --no-configuration-cache \
            -Dorg.gradle.jvmargs='-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC' \
            -Pkotlin.compiler.execution.strategy=in-process
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Enable accelerated Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot ${{ matrix.name }} Android tablet and capture real app screens
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TABLET_NAME: ${{ matrix.name }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/capture-tablet-screenshots.sh

      - name: Downloadable tablet screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videonic-${{ matrix.name }}-screenshots
          path: screenshots/${{ matrix.name }}/
          if-no-files-found: warn
          retention-days: 14
