name: Videonic Android Build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' || true
      - name: Build debug APK and release AAB
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Upload APK and unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Videonic-Lite-Android-Build
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
